{% extends "base.html" %}
{% block content %}
<h2>{{ room.room_number }} — {{ room.room_type }}</h2>
<div class="detail-container">
    <img src="{{ room.image_url }}" width="350">
    <p><strong>Toifasi:</strong> {{ room.room_type }}</p>
    <p><strong>Sig'imi:</strong> {{ room.capacity }} kishi</p>
    <p><strong>Bir kunlik narxi:</strong> {{ room.price_per_night }} so'm</p>
    <p><strong>Qulayliklar:</strong> {{ room.description }}</p>

    <h3>Xonani bron qilish</h3>
    <form method="POST">
        <input type="text" name="guest_name" placeholder="Ism va Familiyangiz" required><br><br>
        <input type="text" name="phone" placeholder="Telefon raqamingiz" required><br><br>
        <label>Kelish sanasi:</label><br>
        <input type="date" name="check_in" required><br><br>
        <label>Ketish sanasi:</label><br>
        <input type="date" name="check_out" required><br><br>
        <button type="submit" class="btn">Bron qilishni tasdiqlash</button>
    </form>
</div>
{% endblock %}
